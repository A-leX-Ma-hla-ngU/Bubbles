
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>For You LeighboO❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* Soft background glow */
    .glow {
      position: fixed;
      width: 45vw;
      height: 45vw;
      max-width: 500px;
      max-height: 500px;
      border-radius: 50%;
      background: rgba(255, 20, 147, 0.08);
      filter: blur(80px);
      pointer-events: none;
      animation: breathe 4s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% {
        transform: scale(0.9);
        opacity: 0.5;
      }

      50% {
        transform: scale(1.15);
        opacity: 1;
      }
    }

    .message {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(0.7);

      width: 90%;
      text-align: center;

      color: #fff;
      font-size: clamp(25px, 7vw, 55px);
      font-weight: bold;

      opacity: 0;

      text-shadow:
        0 0 10px #ffb6c1,
        0 0 25px #ff69b4,
        0 0 50px #ff1493;

      pointer-events: none;

      transition:
        opacity 2s ease,
        transform 2s cubic-bezier(.17,.67,.3,1.3);
    }

    .message.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .subtitle {
      display: block;
      margin-top: 15px;

      font-size: clamp(13px, 3.5vw, 20px);
      font-weight: normal;

      color: #ffb6c1;
      letter-spacing: 2px;

      text-shadow:
        0 0 10px #ff69b4,
        0 0 20px #ff1493;
    }

    /* Floating hearts */
    .floating-heart {
      position: fixed;
      bottom: -30px;

      color: #ff69b4;
      font-size: 18px;

      pointer-events: none;

      animation: floatUp linear forwards;

      text-shadow:
        0 0 8px #ff1493,
        0 0 20px #ff69b4;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(0.5) rotate(0deg);
        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      100% {
        transform:
          translateY(-110vh)
          translateX(var(--drift))
          scale(1.2)
          rotate(360deg);

        opacity: 0;
      }
    }

    /* Small instruction */
    .hint {
      position: fixed;
      bottom: 25px;
      width: 100%;

      text-align: center;

      color: rgba(255, 182, 193, 0.5);
      font-size: 12px;
      letter-spacing: 1px;

      transition: opacity 2s ease;
    }

    .hint.hidden {
      opacity: 0;
    }
  </style>
</head>

<body>

  <div class="glow"></div>

  <canvas id="heartCanvas"></canvas>

  <div class="message" id="message">
    I love you, my Bubbles❤️
    <span class="subtitle">
      More than words can explain.
    </span>
  </div>

  <div class="hint" id="hint">
    coded with love, just for you ❤️
  </div>


  <script>

    /* ==========================================
       CANVAS SETUP
    ========================================== */

    const canvas = document.getElementById("heartCanvas");
    const ctx = canvas.getContext("2d");

    let width;
    let height;
    let scale;

    function resize() {

      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = width * window.devicePixelRatio;
      canvas.height = height * window.devicePixelRatio;

      canvas.style.width = width + "px";
      canvas.style.height = height + "px";

      ctx.setTransform(
        window.devicePixelRatio,
        0,
        0,
        window.devicePixelRatio,
        0,
        0
      );

      /*
        Make the heart automatically fit
        both phones and computers.
      */

      scale = Math.min(width, height) / 40;
    }

    resize();

    window.addEventListener("resize", resize);


    /* ==========================================
       MATHEMATICAL HEART
    ========================================== */

    function heartX(t) {

      return 16 * Math.pow(Math.sin(t), 3);

    }


    function heartY(t) {

      return (
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t)
      );

    }


    /*
      Generate points around the heart.
    */

    const points = [];

    const numberOfPoints = 700;

    for (let i = 0; i < numberOfPoints; i++) {

      const angle =
        (i / numberOfPoints) * Math.PI * 2;

      points.push({
        x: heartX(angle),
        y: heartY(angle)
      });

    }


    /* ==========================================
       DRAWING ANIMATION
    ========================================== */

    let currentPoint = 0;

    let drawingFinished = false;

    function drawHeart() {

      /*
        Slightly transparent black creates
        a beautiful fading trail.
      */

      ctx.fillStyle = "rgba(0, 0, 0, 0.12)";

      ctx.fillRect(0, 0, width, height);


      const centerX = width / 2;
      const centerY = height / 2;


      /*
        Draw several layers to create
        the glowing neon effect.
      */

      for (let layer = 0; layer < 6; layer++) {

        const layerScale =
          scale * (0.70 + layer * 0.06);

        const opacity =
          0.15 + layer * 0.12;

        ctx.fillStyle =
          `rgba(255, 182, 193, ${opacity})`;

        ctx.shadowColor = "#ff1493";

        ctx.shadowBlur =
          10 + layer * 5;


        for (let i = 0; i < currentPoint; i++) {

          const point = points[i];

          const x =
            centerX +
            point.x * layerScale;

          const y =
            centerY -
            point.y * layerScale;


          ctx.beginPath();

          ctx.arc(
            x,
            y,
            1.4 + layer * 0.15,
            0,
            Math.PI * 2
          );

          ctx.fill();

        }

      }

      ctx.shadowBlur = 0;


      /*
        Slowly reveal the heart.
      */

      if (currentPoint < numberOfPoints) {

        currentPoint += 4;

        requestAnimationFrame(drawHeart);

      } else {

        drawingFinished = true;

        revealMessage();

        startFloatingHearts();

      }

    }


    /* ==========================================
       MESSAGE REVEAL
    ========================================== */

    function revealMessage() {

      const message =
        document.getElementById("message");

      const hint =
        document.getElementById("hint");


      setTimeout(() => {

        message.classList.add("show");

        hint.classList.add("hidden");

      }, 700);

    }


    /* ==========================================
       FLOATING HEARTS
    ========================================== */

    function createFloatingHeart() {

      const heart =
        document.createElement("div");

      heart.className =
        "floating-heart";

      heart.innerHTML =
        Math.random() > 0.5 ? "♥" : "♡";


      /*
        Random horizontal starting position.
      */

      heart.style.left =
        Math.random() * 100 + "vw";


      /*
        Random size.
      */

      heart.style.fontSize =
        (12 + Math.random() * 22) + "px";


      /*
        Random animation speed.
      */

      const duration =
        5 + Math.random() * 6;

      heart.style.animationDuration =
        duration + "s";


      /*
        Random sideways movement.
      */

      const drift =
        (Math.random() * 200 - 100) + "px";

      heart.style.setProperty(
        "--drift",
        drift
      );


      document.body.appendChild(heart);


      /*
        Remove the element after
        its animation finishes.
      */

      setTimeout(() => {

        heart.remove();

      }, duration * 1000);

    }


    function startFloatingHearts() {

      /*
        Create hearts periodically.
      */

      setInterval(() => {

        createFloatingHeart();

      }, 650);

    }


    /* ==========================================
       START
    ========================================== */

    drawHeart();

  </script>

</body>
</html>
