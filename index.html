<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>I Love You my Bubbles❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    canvas {
      width: 100vw;
      height: 100vh;
    }

    .message {
      position: absolute;
      color: #ffb6c1;
      font-size: clamp(20px, 6vw, 40px);
      font-weight: bold;
      text-align: center;
      opacity: 0;
      animation: appear 2s ease-in forwards;
      animation-delay: 3s;
      text-shadow: 0 0 10px #ff69b4,
                   0 0 20px #ff69b4,
                   0 0 40px #ff1493;
      pointer-events: none;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: scale(0.5);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>

<body>

  <canvas id="heart"></canvas>

  <div class="message">
    I love you my Bubbles ❤️
  </div>

  <script>
    const canvas = document.getElementById("heart");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    // Mathematical heart function
    function heartX(t) {
      return 16 * Math.pow(Math.sin(t), 3);
    }

    function heartY(t) {
      return (
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t)
      );
    }

    let points = [];

    const scale = Math.min(
      window.innerWidth,
      window.innerHeight
    ) / 40;

    // Create the heart points
    for (let i = 0; i < 500; i++) {
      const angle = (i * Math.PI * 2) / 500;

      points.push({
        x: heartX(angle),
        y: heartY(angle)
      });
    }

    let currentPoint = 0;

    function drawHeart() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.15)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#ffb6c1";
      ctx.shadowColor = "#ff1493";
      ctx.shadowBlur = 15;

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      // Draw several layers of the heart
      for (let layer = 0; layer < 5; layer++) {

        const layerScale = scale * (0.75 + layer * 0.06);

        for (let i = 0; i < currentPoint; i++) {

          const p = points[i];

          const x = centerX + p.x * layerScale;
          const y = centerY - p.y * layerScale;

          ctx.beginPath();

          ctx.arc(x, y, 1.5, 0, Math.PI * 2);

          ctx.fill();
        }
      }

      ctx.shadowBlur = 0;

      if (currentPoint < points.length) {
        currentPoint += 3;
        requestAnimationFrame(drawHeart);
      }
    }

    drawHeart();
  </script>

</body>
</html>
